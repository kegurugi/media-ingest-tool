[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "media-ingest"
version = "0.1.0"
description = "Offload camera and audio cards to multiple drives with checksum verification, reports and a media log."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["xxhash>=3", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ascmhl>=1.2"]

[project.scripts]
mit = "media_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
